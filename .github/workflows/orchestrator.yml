name: Cloud Gaming Orchestrator (5h Auto-Restart)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 5.5 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Master Health Monitor & Auto-Restart Watchdog (5 Hours)
        env:
          GH_PAT: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          node orchestrator.js &
          PROC_PID=$!

          echo "Orchestrator active! Running for 4 hours 50 minutes..."
          sleep 17400

          kill $PROC_PID || true

      - name: Trigger Auto-Restart Next Cycle
        if: always()
        run: |
          echo "Triggering next 5-hour cycle..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/orchestrator.yml/dispatches" \
            -d '{"ref":"main"}' || true
